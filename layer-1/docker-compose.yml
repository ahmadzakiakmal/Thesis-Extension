services:
  l1-node0:
    image: l1-node:latest
    container_name: l1-node0
    ports:
      - "5000:5000"
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./node-config/node0:/root/.cometbft
    command: 
      - "/app/bin"
      - "--cmt-home=/root/.cometbft"
      - "--http-port=5000"
      - "--postgres-host=l1-postgres0:5432"
    depends_on:
      - l1-postgres0
    networks:
      - l1-network

  l1-postgres0:
    image: postgres:14
    container_name: l1-postgres0
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: l1db
    volumes:
      - l1-postgres-data0:/var/lib/postgresql/data
    ports:
      - "5437:5432"
    networks:
      - l1-network

